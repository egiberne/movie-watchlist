<html>

        <header>
            <h1>Find your film</h1>
            <nav>
                <a href="watchlist.html" target="_blank">My Watchlist</a>
            </nav>
        </header>

        <main>
            <section id="search-bar" class="search-bar">
                <input type="search" id="seach-bar" >

                <div id="search-control" class="search-control">

                    <button>Search</button>
                </div>
            </section>

            <section id="initial-state" class="initial-state">
                <h2>Start Exploring</h2>
                <img src="asset/img/striproll.png" atl="A light grey negative film strip roll."> 
            </section>

            <section id="no-data-state" class="no-data-state">
                <h2>Unable to find what you’re looking for. Please try another search.</h2>
            </section>
        </main>

        <footer>
            <p>copyright</p>

        </footer>
