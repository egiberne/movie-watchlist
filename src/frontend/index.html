<html>
    <head>
        <link  href="index.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <h1 id="title">Find your film</h1>
            <nav>
                <a href="watchlist.html" target="_blank">My Watchlist</a>
            </nav>
        </header>
        <div id="search-bar" class="search-bar">
                    <input type="search" placeholder="Blade Runner">

                    <div id="search-bar-sort" class="search-bar-sort">
                        <input type="checkbox" id="sort-box">
                        <button>Search</button>
                    </div>
        </div>
        <main>
            


            <section id="initial-state" class="initial-state">
                <h2>Start Exploring</h2>
                <img src="asset/img/striproll.png" atl="A light grey negative film strip roll."> 
            </section>

            <section id="no-data-state" class="no-data-state">
                <h2>Unable to find what you’re looking for. Please try another search.</h2>
            </section>

            <section id="populated-state-search-page" class="populated-state-search-page">
            
            </section>

        </main>

        <footer>
            <p>copyright</p>

        </footer>
    </body>

    <script src="index.js"></script>
</html>
